[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcad"
version = "0.1.0"
description = "GCAD: multivariate time series anomaly detection from the perspective of Granger causality (re-implementation of Liu, Gao & Jiao, AAAI-25)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.3,<2",
    "scipy>=1.11,<2",
    "torch>=2.1,<3",
    "pyyaml>=6.0,<7",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
gcad = "gcad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: trains a small model end to end (~10 s); deselect with -m 'not slow'"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E741"]  # N, A, B are the paper's symbols

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
